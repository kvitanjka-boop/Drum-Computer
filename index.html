<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drumcomputer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#0d0f14;--panel:#171a21;--txt:#dfe3ec;--mut:#8890a0;--acc:#e08a10;--pad:#363943;--pad2:#464a55;--btn:#2a2e3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:var(--btn);border:0;border-radius:10px;touch-action:manipulation;cursor:pointer}
  button:active{filter:brightness(1.3)}
  a{color:var(--mut);font-size:13px}
  .app{display:flex;flex-direction:column;gap:10px;padding:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom));min-height:100dvh}
  aside{display:contents}
  .card{background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
  #transport{order:1}#gridwrap{order:2}#stylesCard{order:3}#tempoCard{order:4}#panel{order:5}
  .row{display:flex;align-items:center;gap:8px}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  #play{background:#27ae60;font-weight:700;font-size:17px;height:48px;min-width:110px}
  #play.on{background:#c0392b}
  #clear{height:48px;padding:0 14px}
  .bpmbox{display:flex;align-items:center;gap:6px;margin-left:auto}
  .bpmbox button{width:44px;height:44px;font-size:24px;line-height:1}
  #bpmVal{min-width:64px;text-align:center;font:700 28px/1 ui-monospace,Menlo,monospace;color:#9dff6a;background:#10160f;border-radius:8px;padding:8px 6px}
  .lbl{font-size:12px;color:var(--mut);letter-spacing:.06em;min-width:54px}
  input[type=range]{flex:1;min-width:0;height:32px;margin:0;accent-color:var(--acc);touch-action:pan-y}
  .val{font-size:13px;min-width:46px;text-align:right;color:var(--txt)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{height:38px;padding:0 12px;font-size:13px;font-weight:600;border-radius:9px}
  .chips button.on,.seg button.on{background:var(--acc);color:#111}
  .seg{display:flex;gap:6px}.seg button{flex:1;height:40px;font-size:13px;font-weight:600}
  /* Raster */
  #gridwrap{min-height:0}
  #grid{display:grid;gap:4px;width:100%}
  #grid.h{grid-template-columns:62px repeat(16,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));height:100%}
  #grid.v{grid-template-columns:34px repeat(8,minmax(0,1fr));grid-auto-rows:40px}
  .pad{border-radius:7px;background:var(--pad);padding:0;min-width:0;min-height:0}
  .pad.g1{background:var(--pad2)}
  .pad.on{background:var(--c)}
  .pad.now{outline:3px solid #fff;outline-offset:-3px;filter:brightness(1.45)}
  .h .pad.gs{margin-left:7px}
  .v .gs{margin-top:7px}
  .lab{font-weight:800;font-size:13px;background:#1c1f27;border-radius:8px;padding:0 2px}
  .v .lab{font-size:11px;height:32px}
  .lab.sel{outline:2px solid currentColor;outline-offset:-2px}
  .num{font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center}
  .num.now{color:#fff;font-weight:800}
  #saveCard{order:6}
  .txt{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid #333847;background:#0f1117;color:var(--txt);padding:0 12px;font:inherit;-webkit-user-select:text;user-select:text}
  #saveBtn{height:44px;padding:0 16px;background:#27ae60;font-weight:700}
  #plist{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;gap:6px}
  .item .load{flex:1;text-align:left;height:44px;padding:0 12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .del{width:44px;height:44px;background:#3a2326;color:#ff8a8a}
  #msg{font-size:12px;color:var(--mut);margin:0;min-height:1.2em}
  #panel h3{margin:0;font-size:15px;letter-spacing:.06em}
  #hint{font-size:12px;color:var(--mut);margin:0}
  /* Querformat: Raster links, Regler rechts */
  @media (orientation:landscape) and (min-width:640px){
    .app{display:grid;grid-template-columns:minmax(0,1fr) 330px;height:100dvh;min-height:0;overflow:hidden;padding:8px;gap:8px}
    #gridwrap{grid-column:1;grid-row:1}
    aside{display:flex;flex-direction:column;gap:8px;grid-column:2;grid-row:1;overflow-y:auto;min-height:0;padding-bottom:6px}
    .card{padding:8px;gap:6px}
    #play{height:42px}#clear{height:42px}
    .bpmbox button{width:38px;height:38px}
    #bpmVal{font-size:24px}
    .chips button{height:32px;padding:0 9px;font-size:12px}
    .seg button{height:34px}
    input[type=range]{height:26px}
  }
</style>
</head>
<body>
<div class="app">
  <div id="gridwrap"><div id="grid"></div></div>
  <aside>
    <section class="card" id="transport">
      <div class="row">
        <button id="play">▶ PLAY</button>
        <button id="clear">CLEAR</button>
        <div class="bpmbox">
          <button id="bpmMinus" aria-label="langsamer">−</button>
          <div id="bpmVal">120</div>
          <button id="bpmPlus" aria-label="schneller">+</button>
        </div>
      </div>
    </section>
    <section class="card" id="tempoCard">
      <div class="row"><span class="lbl">BPM</span><input type="range" id="bpm" min="60" max="200" step="1"></div>
      <div class="chips" id="presets"></div>
      <div class="row"><span class="lbl">SWING</span><input type="range" id="swing" min="0" max="100"><span class="val" id="swingV"></span></div>
      <div class="row"><span class="lbl">LAUTSTÄRKE</span><input type="range" id="vol" min="0" max="100"><span class="val" id="volV"></span></div>
    </section>
    <section class="card" id="stylesCard">
      <div class="lbl">RHYTHMUS</div>
      <div class="chips" id="styles"></div>
      <div class="seg" id="speeds"></div>
    </section>
    <section class="card" id="panel">
      <h3 id="panelTitle">KICK</h3>
      <div class="row"><span class="lbl">TUNE</span><input type="range" id="s_tune" min="0" max="100"><span class="val" id="v_tune"></span></div>
      <div class="row"><span class="lbl">DECAY</span><input type="range" id="s_decay" min="0" max="100"><span class="val" id="v_decay"></span></div>
      <div class="row"><span class="lbl">LEVEL</span><input type="range" id="s_level" min="0" max="100"><span class="val" id="v_level"></span></div>
      <p id="hint">Pad antippen = Schlag an/aus · Instrumentenname antippen = anhören und Regler wählen</p>
      <a href="3d.html">3D-Ansicht öffnen</a>
    </section>
    <section class="card" id="saveCard">
      <div class="lbl">MEINE PRESETS</div>
      <div class="row"><input class="txt" id="pname" maxlength="24" placeholder="Name, z. B. Mein Beat" autocomplete="off"><button id="saveBtn">Speichern</button></div>
      <p id="msg">Dein letzter Stand wird automatisch gespeichert.</p>
      <div id="plist"></div>
    </section>
  </aside>
</div>

<script type="module">
import { STEPS, INSTR, pattern, params, globals, engine, seq, toggle, STYLES, SPEEDS, loadStyle, getState, applyState } from './core.js';

const $ = s => document.querySelector(s);
const R = INSTR.length;
const SHORT = ['KICK', 'SNR', 'CLAP', 'HH C', 'HH O', 'TOM', 'RIM', 'COW'];
let sel = 0, curStyle = -1, curSpeed = 1, padEls = [], numEls = [], nowStep = -1;

const horiz = () => matchMedia('(orientation:landscape) and (min-width:640px)').matches;

/* ---------- Raster ---------- */
function buildGrid() {
  const g = $('#grid'), h = horiz();
  g.innerHTML = ''; g.className = h ? 'h' : 'v';
  padEls = INSTR.map(() => []); numEls = [];
  const lab = r => {
    const b = document.createElement('button');
    b.className = 'lab'; b.dataset.r = r; b.textContent = h ? INSTR[r].name : SHORT[r]; b.style.color = INSTR[r].color; return b;
  };
  const pad = (r, i) => {
    const b = document.createElement('button');
    b.className = 'pad' + (Math.floor(i / 4) % 2 ? ' g1' : '') + (i % 4 === 0 && i > 0 ? ' gs' : '');
    b.dataset.r = r; b.dataset.i = i; b.style.setProperty('--c', INSTR[r].color); b.setAttribute('aria-label', `${INSTR[r].name} Schritt ${i + 1}`);
    padEls[r][i] = b; return b;
  };
  if (h) {
    for (let r = 0; r < R; r++) { g.append(lab(r)); for (let i = 0; i < STEPS; i++) g.append(pad(r, i)); }
  } else {
    g.append(document.createElement('div'));
    for (let r = 0; r < R; r++) g.append(lab(r));
    for (let i = 0; i < STEPS; i++) {
      const n = document.createElement('div'); n.className = 'num' + (i % 4 === 0 && i > 0 ? ' gs' : ''); n.textContent = i + 1; numEls[i] = n; g.append(n);
      for (let r = 0; r < R; r++) { const p = pad(r, i); if (i % 4 === 0 && i > 0) p.classList.add('gs'); g.append(p); }
    }
  }
  refreshAll(); markSel(); setNow(nowStep);
}
function refreshAll() { for (let r = 0; r < R; r++) for (let i = 0; i < STEPS; i++) padEls[r][i].classList.toggle('on', pattern[r][i]); }
function markSel() { document.querySelectorAll('.lab').forEach(b => b.classList.toggle('sel', +b.dataset.r === sel)); }
function setNow(step) {
  if (nowStep >= 0) { for (let r = 0; r < R; r++) padEls[r][nowStep]?.classList.remove('now'); numEls[nowStep]?.classList.remove('now'); }
  nowStep = step;
  if (step >= 0) { for (let r = 0; r < R; r++) padEls[r][step]?.classList.add('now'); numEls[step]?.classList.add('now'); }
}

$('#grid').addEventListener('click', e => {
  engine.init();
  const p = e.target.closest('.pad'), l = e.target.closest('.lab');
  if (p) {
    const r = +p.dataset.r, i = +p.dataset.i;
    pattern[r][i] = !pattern[r][i]; p.classList.toggle('on', pattern[r][i]);
    if (pattern[r][i]) engine.trigger(r, engine.ctx.currentTime);
    if (navigator.vibrate) navigator.vibrate(6);
  } else if (l) {
    sel = +l.dataset.r; markSel(); syncPanel(); engine.trigger(sel, engine.ctx.currentTime);
  }
});
matchMedia('(orientation:landscape) and (min-width:640px)').addEventListener('change', buildGrid);

/* ---------- Transport ---------- */
let wake = null;
async function keepAwake(on) {
  try { if (on && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); else if (wake) { await wake.release(); wake = null; } } catch (e) {}
}
function updatePlay() { const b = $('#play'); b.textContent = seq.playing ? '■ STOP' : '▶ PLAY'; b.classList.toggle('on', seq.playing); }
function doToggle() { engine.init(); toggle(); if (!seq.playing) setNow(-1); updatePlay(); keepAwake(seq.playing); }
$('#play').addEventListener('click', doToggle);
$('#clear').addEventListener('click', () => { pattern.forEach(r => r.fill(false)); refreshAll(); });
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'Space') { e.preventDefault(); doToggle(); }
  if (e.code === 'ArrowUp' || e.code === 'ArrowRight') { e.preventDefault(); setBpm(globals.bpm + 1); }
  if (e.code === 'ArrowDown' || e.code === 'ArrowLeft') { e.preventDefault(); setBpm(globals.bpm - 1); }
});

/* ---------- Tempo, Swing, Lautstärke ---------- */
function setBpm(b) { globals.bpm = Math.min(200, Math.max(60, Math.round(b))); syncGlobals(); }
function syncGlobals() {
  $('#bpmVal').textContent = globals.bpm; $('#bpm').value = globals.bpm;
  $('#swing').value = Math.round(globals.swing * 100); $('#swingV').textContent = Math.round(globals.swing * 100) + ' %';
  $('#vol').value = Math.round(globals.volume * 100); $('#volV').textContent = Math.round(globals.volume * 100) + ' %';
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', +b.dataset.b === globals.bpm));
}
$('#bpm').addEventListener('input', e => setBpm(+e.target.value));
$('#swing').addEventListener('input', e => { globals.swing = e.target.value / 100; syncGlobals(); });
$('#vol').addEventListener('input', e => { globals.volume = e.target.value / 100; if (engine.master) engine.master.gain.value = globals.volume; syncGlobals(); });
let hold = null;
const stopHold = () => { clearTimeout(hold); clearInterval(hold); };
[['#bpmMinus', -1], ['#bpmPlus', 1]].forEach(([id, d]) => {
  const b = $(id);
  b.addEventListener('pointerdown', () => { setBpm(globals.bpm + d); stopHold(); hold = setTimeout(() => { hold = setInterval(() => setBpm(globals.bpm + d), 70); }, 380); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stopHold));
});
[80, 100, 120, 140, 170].forEach(b => {
  const el = document.createElement('button'); el.textContent = b; el.dataset.b = b;
  el.addEventListener('click', () => setBpm(b)); $('#presets').append(el);
});

/* ---------- Rhythmen ---------- */
function applyStyle() {
  if (curStyle < 0) curStyle = 0;
  loadStyle(curStyle, curSpeed);
  refreshAll(); syncGlobals(); markStyles();
}
function markStyles() {
  document.querySelectorAll('#styles button').forEach((b, i) => b.classList.toggle('on', i === curStyle));
  document.querySelectorAll('#speeds button').forEach((b, i) => b.classList.toggle('on', i === curSpeed));
}
STYLES.forEach((st, i) => {
  const b = document.createElement('button'); b.textContent = st.n;
  b.addEventListener('click', () => { engine.init(); curStyle = i; applyStyle(); }); $('#styles').append(b);
});
SPEEDS.forEach((n, i) => {
  const b = document.createElement('button'); b.textContent = n;
  b.addEventListener('click', () => { engine.init(); curSpeed = i; applyStyle(); }); $('#speeds').append(b);
});

/* ---------- Instrument-Regler ---------- */
const fmtTune = v => (v < 0.5 ? '−' : '+') + Math.round(Math.abs(v - 0.5) * 200) + ' %';
const fmt = { tune: fmtTune, decay: v => Math.round(v * 100) + ' %', level: v => Math.round(v * 100) + ' %' };
function syncPanel() {
  $('#panelTitle').textContent = INSTR[sel].name; $('#panelTitle').style.color = INSTR[sel].color;
  ['tune', 'decay', 'level'].forEach(k => {
    const s = $('#s_' + k); s.value = Math.round(params[sel][k] * 100); s.style.accentColor = INSTR[sel].color;
    $('#v_' + k).textContent = fmt[k](params[sel][k]);
  });
}
['tune', 'decay', 'level'].forEach(k => {
  const s = $('#s_' + k);
  s.addEventListener('input', () => { params[sel][k] = s.value / 100; $('#v_' + k).textContent = fmt[k](params[sel][k]); });
  s.addEventListener('change', () => { engine.init(); engine.trigger(sel, engine.ctx.currentTime); });
});

/* ---------- Speichern ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const snapshot = () => ({ ...getState(), style: curStyle, speed: curSpeed, sel });
function restore(s) {
  if (!applyState(s)) return false;
  curStyle = Number.isInteger(s.style) && s.style >= 0 && s.style < STYLES.length ? s.style : -1;
  curSpeed = Number.isInteger(s.speed) && s.speed >= 0 && s.speed < SPEEDS.length ? s.speed : 1;
  sel = Number.isInteger(s.sel) && s.sel >= 0 && s.sel < R ? s.sel : 0;
  if (engine.master) engine.master.gain.value = globals.volume;
  if (padEls.length) refreshAll();
  syncGlobals(); syncPanel(); markSel(); markStyles();
  return true;
}
const say = t => { $('#msg').textContent = t; };
function renderPresets() {
  const list = store.get('drum.presets', []), box = $('#plist'); box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<p id="hint">Noch nichts gespeichert.</p>'; return; }
  list.forEach((p, i) => {
    const row = document.createElement('div'); row.className = 'item';
    const l = document.createElement('button'); l.className = 'load'; l.textContent = `${p.name} · ${p.state.g.bpm} BPM`;
    l.addEventListener('click', () => { if (restore(p.state)) say(`„${p.name}“ geladen.`); });
    const d = document.createElement('button'); d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', 'Löschen');
    d.addEventListener('click', () => {
      if (!confirm(`„${p.name}“ löschen?`)) return;
      const cur = store.get('drum.presets', []); cur.splice(i, 1); store.set('drum.presets', cur); renderPresets(); say('Gelöscht.');
    });
    row.append(l, d); box.append(row);
  });
}
$('#saveBtn').addEventListener('click', () => {
  const name = $('#pname').value.trim();
  if (!name) { say('Bitte erst einen Namen eingeben.'); $('#pname').focus(); return; }
  const list = store.get('drum.presets', []), at = list.findIndex(p => p.name === name);
  const entry = { name, state: snapshot(), t: Date.now() };
  if (at >= 0) list[at] = entry; else list.unshift(entry);
  if (store.set('drum.presets', list)) { say(at >= 0 ? `„${name}“ überschrieben.` : `„${name}“ gespeichert.`); $('#pname').value = ''; renderPresets(); }
  else say('Speichern nicht möglich (Browser blockiert den Speicher).');
});
// Letzten Stand automatisch merken
let lastJson = '';
setInterval(() => { const j = JSON.stringify(snapshot()); if (j !== lastJson) { lastJson = j; store.set('drum.last', JSON.parse(j)); } }, 1500);
addEventListener('pagehide', () => store.set('drum.last', snapshot()));
const saved = store.get('drum.last', null);
if (saved) restore(saved);
renderPresets();

/* ---------- Start ---------- */
addEventListener('pointerup', () => engine.init());
function frame() {
  requestAnimationFrame(frame);
  if (engine.ctx && seq.playing) {
    while (seq.queue.length && seq.queue[0].time <= engine.ctx.currentTime) setNow(seq.queue.shift().step);
  }
}
buildGrid(); syncGlobals(); syncPanel(); markStyles(); updatePlay(); frame();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
window.__drum = { pattern, params, globals, seq, engine, STYLES };
</script>
</body>
</html>
